server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 5m;

    location = / {
        return 302 /aurora/;
    }

    location = /CSTS {
        return 404;
    }

    # Retired CSTS routes.
    location = /CSTSd {
        return 301 /CSTSd/;
    }

    location ^~ /CSTSd/ {
        return 410;
    }

    # Keep bookmarks made during the initial Docker deployment working.
    location = /CSTS-docker {
        return 301 /CSTSd/;
    }

    location ^~ /CSTS-docker/ {
        rewrite ^/CSTS-docker/(.*)$ /CSTSd/$1 permanent;
    }

    location ^~ /CSTS/ {
        return 404;
    }

    location = /resume {
        return 301 /resume/;
    }

    location ^~ /resume/ {
        alias /home/ubuntu/Project/resume/;
        index index.html;
    }

    location /uploads/ { return 410; }


    location = /aurora { return 301 /aurora/; }

    location ^~ /aurora/ {
        root /opt/aurora-demo/current/web;
        try_files $uri $uri/ /aurora/index.html;
        add_header Cache-Control "no-cache";
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:18082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }

    location / {
        return 302 /aurora/;
    }
}

# ==== par73e.cn HTTPS ====
server {
    listen 443 ssl;
    server_name par73e.cn www.par73e.cn;

    ssl_certificate /etc/nginx/ssl/par73e.cn_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/par73e.cn.key;

    client_max_body_size 5m;

    location = /resume {
        return 301 /resume/;
    }

    location ^~ /resume/ {
        alias /home/ubuntu/Project/resume/;
        index index.html;
    }

    location = /CSTSd {
        return 301 /CSTSd/;
    }

    location ^~ /CSTSd/ {
        return 410;
    }

    location /uploads/ { return 410; }

    location = /aurora { return 301 /aurora/; }

    location ^~ /aurora/ {
        root /opt/aurora-demo/current/web;
        try_files $uri $uri/ /aurora/index.html;
        add_header Cache-Control "no-cache";
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:18082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }

    location / {
        return 302 /aurora/;
    }
}

# ==== HTTP 自动跳转 HTTPS ====
server {
    listen 80;
    server_name par73e.cn www.par73e.cn;

    client_max_body_size 5m;

    location = /resume {
        return 301 https://par73e.cn/resume/;
    }

    location ^~ /resume/ {
        return 301 https://par73e.cn$request_uri;
    }

    location / {
        return 301 https://par73e.cn$request_uri;
    }
}
